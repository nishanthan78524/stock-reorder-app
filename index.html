<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Stock Reorder App</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<header><h1>Stock Reorder</h1><p>Scan products and send your reorder list</p></header>
<main>
<section class="card">
<h2>Scan Product</h2>
<div class="scanner"><video id="video" playsinline muted></video><div id="scanLine"></div></div>
<div class="actions"><button id="startCamera" class="primary">📷 Start Camera</button><button id="stopCamera" class="secondary" disabled>Stop Camera</button></div>
<p id="cameraStatus" class="status">Camera is stopped.</p>
<div class="divider">OR</div>
<label for="barcodeInput">Enter barcode manually</label>
<div class="manual"><input id="barcodeInput" inputmode="numeric" placeholder="e.g. 5012345678901"><button id="addBarcode" class="primary">Add</button></div>
<p id="message" class="message"></p>
</section>

<section class="card">
<div class="title"><h2>Reorder List</h2><span id="itemCount" class="badge">0</span></div>
<div id="emptyState" class="empty">No products added yet.</div>
<div id="reorderList"></div>
<div class="actions"><button id="clearList" class="danger">Clear List</button><button id="sendWhatsApp" class="whatsapp">Create PDF & Send via WhatsApp</button></div>
</section>

<section class="card">
<h2>Settings</h2>
<label for="whatsappNumber">WhatsApp destination number</label>
<input id="whatsappNumber" inputmode="tel" placeholder="447700900123">
<small>Use international format without + or spaces.</small>
<button id="saveSettings" class="primary full">Save Settings</button>
<p id="settingsStatus" class="status"></p>
</section>

</main>
<footer>Stock Reorder App — GitHub Pages test version</footer>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
